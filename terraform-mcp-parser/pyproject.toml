[project]
name = "terraform-mcp-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ekanshgupta123", email = "ekanshgupta2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "chromadb>=1.5.9",
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
    "python-hcl2>=8.1.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
terraform-mcp-parser = "terraform_mcp_parser:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
